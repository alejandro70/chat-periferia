<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro como proveedor</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Registro como proveedor</h1>
    <p>Prepare formularios y soportes para revisión humana. No se realizan envíos.</p>
    <section id="history" aria-live="polite" aria-label="Historial de conversación"></section>
    <p id="status" role="status"></p>
    <section id="decisions" aria-label="Campos por validar"></section>
    <form id="chat">
      <label for="message">Mensaje</label>
      <textarea id="message" rows="3" required placeholder="Procesa el caso ec-corp-andina"></textarea>
      <button type="submit">Enviar mensaje</button>
    </form>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
